name: Build M54ME PRO APK - Zero Error
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }
      - name: Build PRO APK FIXED
        run: |
          echo "Building M54ME PRO v2.1 FIXED..."
          gradle --version
          gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M54ME-PRO-APK-v2.1-FIXED
          path: app/build/outputs/apk/debug/*.apk
      - name: Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.1-FIXED-${{ github.run_number }}
          name: "M54ME PRO v2.1 FIXED - ${{ github.run_number }}"
          body: |
            FIXED BUILD - Zero Error
            Gradle 8.5 + AGP 8.2.2
            Realtime + 0.1/0.01/0.04/0.03/0.02 + Grappler + CheatSheet
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}